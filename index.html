<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Bank Bendahara</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Styling pelengkap/fallback jika style.css belum lengkap */
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.25rem;
      box-sizing: border-box;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      text-align: center;
    }
    .brand-title {
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: 1.75rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 0;
      margin-bottom: 1.75rem;
    }
    .input-group {
      margin-bottom: 1.25rem;
      text-align: left;
    }
    .input-field {
      width: 100%;
      padding: 0.85rem 1rem;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .btn-submit {
      width: 100%;
      padding: 0.85rem 1rem;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    .btn-submit:hover {
      background: #0369a1;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error-msg {
      display: none;
      margin-top: 1rem;
      font-size: 0.875rem;
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 0.75rem;
      border-radius: 8px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
  </style>
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <h2 class="brand-title">Bank Bendahara</h2>
      <p class="subtitle">Silakan masukkan kode akses Anda</p>
      
      <form id="loginForm" novalidate>
        <div class="input-group">
          <label for="accessKey" class="sr-only">Kode Akses</label>
          <input 
            type="password" 
            id="accessKey" 
            name="accessKey"
            class="input-field"
            placeholder="Masukkan Kode Akses" 
            required 
            autocomplete="current-password"
          >
        </div>
        
        <button type="submit" id="loginBtn" class="btn-submit">Masuk</button>
        <div id="errorMsg" class="error-msg" role="alert"></div>
      </form>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
